      const rij = { locatie: f.loc, id, plant: f.plant, plekken: f.plek, actie: f.actie, detail: f.titel, maanden: mnd, deel_start: f.deel, toelichting: f.toel };
      if (!zelfde) Object.assign(rij, { soort: 'taak', herhaling: 'jaarlijks', keuze: '', status: '' });
      acts.push({ op: 'taak_zet', tab, rij });
    } else {
      const van = f.van ? f.jaar + '-' + pad(f.van) : '', tot = f.van ? (f.tot < f.van ? f.jaar + 1 : f.jaar) + '-' + pad(f.tot || f.van) : '';
      const rij = { locatie: f.loc, id, titel: f.titel, actie: f.actie, plekken: f.plek, plant: f.plant, van, tot, deel: f.deel, toelichting: f.toel };
      if (!zelfde) Object.assign(rij, { status: 'open', wanneer: '' });
      else if (van !== (p.van || '') || tot !== (p.tot || '')) rij.wanneer = '';
      acts.push({ op: 'taak_zet', tab, rij });
    }
    schrijf(acts); dlg.close(); melding(t ? 'Taak opgeslagen' : 'Taak toegevoegd');
  };
  dlg.onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (d.ta != null) { lees(); f.actie = d.ta; return teken2(); }
    if (d.tl != null) { lees(); if (f.loc !== d.tl) { f.loc = d.tl; f.plek = D.plek[d.tl + '|algemeen'] ? 'algemeen' : ''; f.plant = ''; } return teken2(); }
    if (d.th != null) { lees(); f.herh = d.th; if (f.herh === 'jaar' && !f.van) f.van = f.tot = S.maand; return teken2(); }
    if (d.tdl != null) { lees(); f.deel = d.tdl; return teken2(); }
    if (d.d === 'sluit') return dlg.close();
    if (d.d === 'ok') return opslaan();
    if (d.d === 'weg' && confirm('Deze taak laten vervallen? Hij verdwijnt dan uit de app.')) { schrijf([{ op: 'taak_zet', tab: r ? 'Regels' : 'Projecttaken', rij: { locatie: t.loc, id: (r || p).id, status: 'vervallen' } }]); dlg.close(); }
  };
  dlg.onchange = ev => { if (ev.target.id === 't-plant') { lees(); teken2(); } };
  teken2();
  dlg.showModal();
}

/* ---------- plek of plant toevoegen of bewerken ---------- */
const VELDEN = {
  plek: { tab: 'Plekken', naam: 'naam', velden: [['naam', 'Naam'], ['type', 'Soort plek', 'lijst'], ['beschrijving', 'Beschrijving', 'lang'], ['zon', 'Zon'], ['maat', 'Maat'], ['m2', 'Oppervlak (m²)'], ['grond', 'Grond'], ['mulch', 'Mulch'], ['water_per_week', 'Water per week'], ['thema', 'Thema'], ['plantplek_en_mest', 'Plantplek en mest (één punt per regel)', 'punten']] },
  plant: { tab: 'Planten', naam: 'nl', velden: [['nl', 'Naam'], ['latijn', 'Latijnse naam'], ['emoji', 'Emoji'], ['soort', 'Soort', 'soort'], ['levensduur', 'Levensduur', 'lijst'], ['hoogte', 'Hoogte'], ['plantafstand', 'Plantafstand'], ['familie', 'Familie'], ['bloei', 'Bloei'], ['plantmoment', 'Plantmoment'], ['beschrijving', 'Beschrijving', 'lang'], ['tip', 'Tip', 'lang'], ['onderhoud', 'Onderhoud', 'lang'], ['link_url', 'Link naar meer informatie']] }
};
const slug = t => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'nieuw';
function rijForm(soort, arg) {
  const c = VELDEN[soort], [l0, id0] = arg ? arg.split('|') : [], rij = arg ? (soort === 'plek' ? D.plek : D.plant)[l0 + '|' + id0] : null;
  if (arg && !rij) return;
  const alle = D[ALLE[c.tab]], f = { loc: rij ? rij.locatie : (S.loc || (locs()[0] || {}).id) };
  c.velden.forEach(([k]) => f[k] = rij ? rij[k] || '' : '');
  const dlg = $('#dlg'), woord = soort === 'plek' ? 'plek' : 'plant';
  const nieuwPlant = soort === 'plant' && !rij; f.plek = ''; f.status = 'gepland';
  const lees = () => { c.velden.forEach(([k, , t]) => { const e = $('#v-' + k); if (e) f[k] = t === 'punten' ? e.value.split(/\n+/).map(x => x.trim()).filter(Boolean).join(' • ') : e.value.trim(); }); if (nieuwPlant) { f.plek = $('#v-plek').value; f.status = $('#v-status').value; } };
  const teken2 = () => {
    dlg.innerHTML = `<div class="taakform"><h3>${rij ? esc(rij[c.naam] || '') + ' bewerken' : 'Nieuwe ' + woord}</h3>
      ${rij ? `<div class="sub">${esc((D.Locaties.find(l => l.id === f.loc) || {}).naam || f.loc)}</div>` : `<label>Waar</label><div class="seg" role="group" aria-label="Locatie">${locs().map(l => `<button type="button" class="${f.loc === l.id ? 'aan' : ''}" data-rl="${esc(l.id)}" aria-pressed="${f.loc === l.id}">${esc(l.naam)}</button>`).join('')}</div>`}
      ${nieuwPlant ? `<div class="twee"><div><label for="v-plek">${esc((D.Locaties.find(l => l.id === f.loc) || {}).plekwoord || 'Plek')}</label><select id="v-plek"><option value="">Nog geen plek</option>${plekOpties(f.loc, f.plek)}</select></div><div><label for="v-status">Status</label><select id="v-status">${['gepland', 'geplant'].map(x => `<option value="${x}" ${x === f.status ? 'selected' : ''}>${statusLabel(x)}</option>`).join('')}</select></div></div>` : ''}
      ${c.velden.map(([k, lab, t]) => `<label for="v-${k}">${lab}</label>${t === 'soort' ? `<select id="v-${k}"><option value="">Kies een soort</option>${soorten().map(g => `<optgroup label="${g.groep}">${g.lijst.map(x => `<option value="${esc(x.naam)}"${x.naam === String(f[k]).toLowerCase() ? ' selected' : ''}>${x.emoji} ${esc(cap(x.naam))}</option>`).join('')}</optgroup>`).join('')}${f[k] && !soortInfo(f[k]) ? `<option value="${esc(f[k])}" selected>${esc(f[k])}</option>` : ''}</select>` : t === 'lang' ? `<textarea id="v-${k}" rows="2">${esc(f[k])}</textarea>` : t === 'punten' ? `<textarea id="v-${k}" rows="5">${esc(String(f[k]).split(' • ').join('\n'))}</textarea>` : `<input id="v-${k}" value="${esc(f[k])}"${t === 'lijst' ? ` list="l-${k}"` : ''}>${t === 'lijst' ? `<datalist id="l-${k}">${[...new Set(alle.map(x => x[k]).filter(Boolean))].sort().map(v => `<option value="${esc(v)}">`).join('')}</datalist>` : ''}`}`).join('')}
      <div class="knoppen">${rij ? '<button type="button" class="knopje vervallen" data-d="weg">Vervallen</button>' : '<span></span>'}<span style="display:flex;gap:8px"><button type="button" class="knopje" data-d="sluit">Annuleren</button><button type="button" class="knopje primair" data-d="ok">${rij ? 'Opslaan' : 'Toevoegen'}</button></span></div></div>`;
  };
  const opslaan = () => {
    lees();
    if (!f[c.naam]) return $('#v-' + c.naam).focus();
    let id = rij ? rij.id : slug(f[c.naam]);
    if (!rij) { const basis = id; for (let n = 2; alle.some(x => x.locatie === f.loc && x.id === id); n++) id = basis + '-' + n; }
    const r = { locatie: f.loc, id };
    c.velden.forEach(([k]) => { if (!rij || f[k] !== (rij[k] || '')) r[k] = f[k]; });
    if (rij && Object.keys(r).length === 2) return dlg.close();
    if (!rij) r.status = soort === 'plek' ? 'actief' : '';
    const acts = [{ op: 'rij_zet', tab: c.tab, rij: r }];
    if (nieuwPlant && f.plek) acts.push({ op: 'stand_zet', rij: { key: f.loc + '|' + id + '|+' + Date.now(), locatie: f.loc, plant: id, naam: '', plek: f.plek, status: f.status, aantal: '', notitie: '', nieuw: 'ja', via_regel: '', datum: vandaag() } });
    schrijf(acts); dlg.close();
    melding(rij ? 'Opgeslagen' : (soort === 'plek' ? 'Plek' : 'Plant') + ' toegevoegd');
    if (!rij) ga(soort + '/' + f.loc + '/' + id);
  };
  const weg = () => {
    const loc = rij.locatie, id = rij.id, bep = beplanting(loc, NUJ).filter(e => (soort === 'plek' ? e.plek : e.plant) === id && e.status !== 'weg').length;
    const rg = D.Regels.filter(r => r.locatie === loc && r.status !== 'vervallen' && (soort === 'plek' ? r.plekLijst.includes(id) : r.plant === id)).length;
    const extra = bep || rg ? `\n\nEr ${bep + rg === 1 ? 'verwijst' : 'verwijzen'} nog ${bep ? bep + (bep === 1 ? ' plant' : ' planten') : ''}${bep && rg ? ' en ' : ''}${rg ? rg + (rg === 1 ? ' taak' : ' taken') : ''} naar deze ${woord}.` : '';
    if (!confirm(`Deze ${woord} laten vervallen? Hij verdwijnt dan uit de app.${extra}`)) return;
    schrijf([{ op: 'rij_zet', tab: c.tab, rij: { locatie: loc, id, status: 'vervallen' } }]); dlg.close(); ga(soort === 'plek' ? 'plekken' : 'planten');
  };
  dlg.onchange = null;
  dlg.onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.rl != null) { lees(); if (f.loc !== b.dataset.rl) f.plek = ''; f.loc = b.dataset.rl; return teken2(); }
    const d = b.dataset.d;
    if (d === 'sluit') return dlg.close();
    if (d === 'ok') return opslaan();
    if (d === 'weg') return weg();
  };
  teken2();
  dlg.showModal();
}

/* ---------- plant naar de andere tuin verplaatsen ---------- */
function verplaats(arg) {
  const [loc, id] = arg.split('|'), pl = D.plant[loc + '|' + id];
  if (!pl) return;
  const doelen = locs().filter(l => l.id !== loc);
  let doel = doelen[0].id;
  const dlg = $('#dlg');
  const teken2 = () => {
    const lo = D.Locaties.find(l => l.id === doel) || {};
    dlg.innerHTML = `<div class="taakform"><h3>${esc(pl.nl)} verplaatsen</h3><div class="sub">Van ${esc((D.Locaties.find(l => l.id === loc) || {}).naam || loc)}</div>
      <label>Naar</label><div class="seg" role="group" aria-label="Tuin">${doelen.map(l => `<button type="button" class="${doel === l.id ? 'aan' : ''}" data-vl="${esc(l.id)}" aria-pressed="${doel === l.id}">${esc(l.naam)}</button>`).join('')}</div>
      <label for="d-plek">${esc(lo.plekwoord || 'Plek')}</label><select id="d-plek">${plekOpties(doel, '')}</select>
      <label for="d-status">Status</label><select id="d-status">${statusOpties('geplant')}</select>
      <label for="d-aantal">Aantal</label><input id="d-aantal" inputmode="numeric">
      <div class="sub" style="margin-top:12px">De plant verdwijnt uit ${esc((D.Locaties.find(l => l.id === loc) || {}).naam || loc)} (status vervallen). Zijn jaarlijkse taken gaan mee.</div>
      <div class="knoppen"><span></span><span style="display:flex;gap:8px"><button type="button" class="knopje" data-d="sluit">Annuleren</button><button type="button" class="knopje primair" data-d="ok">Verplaatsen</button></span></div></div>`;
  };
  dlg.onchange = null;
  dlg.onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.vl != null) { doel = b.dataset.vl; return teken2(); }
    if (b.dataset.d === 'sluit') return dlg.close();
    if (b.dataset.d !== 'ok') return;
    const acts = [], plek = $('#d-plek').value;
    if (!plek) return melding('Kies een plek.');
    const bestaand = D.plant[doel + '|' + id];
    if (!bestaand || bestaand.status === 'vervallen') { const kopie = Object.assign({}, pl); for (const k of Object.keys(kopie)) if (typeof kopie[k] !== 'string') delete kopie[k]; acts.push({ op: 'rij_zet', tab: 'Planten', rij: Object.assign(kopie, { locatie: doel, id, status: '' }) }); }
    if (!D.Regels.some(r => r.locatie === doel && r.plant === id && r.status !== 'vervallen'))
      D.Regels.filter(r => r.locatie === loc && r.plant === id && !r.plekken && r.status !== 'vervallen').forEach((r, i) => acts.push({ op: 'rij_zet', tab: 'Regels', rij: { locatie: doel, id: nieuwId() + '.' + i, plant: id, plekken: '', actie: r.actie, detail: r.detail, soort: r.soort, maanden: r.maanden, keuze: r.keuze, herhaling: r.herhaling, deel_start: r.deel_start, deel_eind: r.deel_eind, uiterlijk: r.uiterlijk, voorwaarde: r.voorwaarde, meting: r.meting, toelichting: r.toelichting, bron: 'verplaatst uit ' + loc, status: '' } }));
    acts.push({ op: 'stand_zet', rij: { key: doel + '|' + id + '|+' + Date.now(), locatie: doel, plant: id, naam: '', plek, status: $('#d-status').value, aantal: $('#d-aantal').value.trim(), notitie: 'verplaatst uit ' + ((D.Locaties.find(l => l.id === loc) || {}).naam || loc), nieuw: 'ja', via_regel: '', datum: vandaag() } });
    acts.push({ op: 'rij_zet', tab: 'Planten', rij: { locatie: loc, id, status: 'vervallen' } });
    schrijf(acts); dlg.close(); melding('Plant verplaatst'); ga('plant/' + doel + '/' + id);
  };
  teken2();
  dlg.showModal();
}

/* ---------- navigatie ---------- */
function kop(h) { $('#kop').innerHTML = h; }
let MELD = null;
function melding(t) { const m = MELD || (MELD = $('#melding')); (document.querySelector('dialog[open]') || document.body).appendChild(m); m.textContent = t; m.style.display = 'block'; clearTimeout(melding.t); melding.t = setTimeout(() => m.style.display = 'none', 3500); }
function ga(h) { location.hash = h; }
const ZON = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', MAAN = '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>';
function themaKeuze() { const t = document.documentElement.dataset.thema || ''; return `<div class="seg" role="group" aria-label="Weergave">${[['', 'Automatisch'], ['licht', svg(ZON, 16, 2) + ' Licht'], ['donker', svg(MAAN, 16, 2) + ' Donker']].map(([k, l]) => `<button class="${t === k ? 'aan' : ''}" data-modus="${k}" aria-pressed="${t === k}" style="display:inline-flex;align-items:center;justify-content:center;gap:6px">${l}</button>`).join('')}</div>`; }
function teken() {
  route = (decodeURIComponent(location.hash.slice(1)) || 'taken').split('/');
  opslag.set('filters', { jaar: S.jaar, maand: S.maand, loc: S.loc, plek: S.plek, actie: S.actie, psoort: S.psoort }); opslag.set('filterdag', vandaag());
  const hoofd = { taken: 'taken', plekken: 'plekken', plek: 'plekken', planten: 'planten', plant: 'planten', jaar: 'jaar', info: 'meer', instellingen: 'meer' }[route[0]] || 'taken';
  $('#nav').innerHTML = [['taken', 'Taken'], ['planten', 'Planten'], ['plekken', 'Plekken'], ['jaar', 'Jaar'], ['info', 'Meer']].map(([h, l]) => { const aan = hoofd === h || (h === 'info' && hoofd === 'meer'); return `<a href="#${h}" class="${aan ? 'aan' : ''}"${aan ? ' aria-current="page"' : ''}><span>${svg(IC[h === 'info' ? 'meer' : h], 22, h === 'info' ? 3 : 1.8)}</span>${l}</a>`; }).join('');
  if (!D) { if (route[0] === 'instellingen') { kop('<div class="rij"><h1>Instellingen</h1></div>'); $('#app').innerHTML = schermInstellingen(); } return; }
  $('#kop').classList.toggle('held', hoofd === 'taken');
  TK = [];
  const f = { taken: schermTaken, plekken: schermPlekken, plek: () => schermPlek(route[1], route[2]), planten: schermPlanten, plant: () => schermPlant(route[1], route[2]), jaar: schermJaar, info: schermMeer, instellingen: schermMeer }[route[0]] || schermTaken;
  $('#app').innerHTML = f();
  const fs = $('#filters'); if (fs.open) fs.innerHTML = route[0] === 'planten' ? plantFilterSheet() : filterSheet();
  $('#tc').content = getComputedStyle(document.documentElement).getPropertyValue(hoofd === 'taken' ? '--kop' : '--bg').trim();
}
addEventListener('hashchange', () => { teken(); scrollTo(0, 0); });
document.addEventListener('click', ev => {
  if (ev.target.id === 'filters') { const r = ev.target.getBoundingClientRect(); if (ev.clientY < r.top || ev.clientY > r.bottom || ev.clientX < r.left || ev.clientX > r.right) return ev.target.close(); }
  const el = ev.target.closest('[data-modus],[data-verplaats],[data-taak],[data-nieuwtaak],[data-nieuwplek],[data-nieuwplant],[data-bewerkplek],[data-bewerkplant],[data-fotoweg],[data-fotoplus],[data-filters],[data-psoort],[data-pwis],[data-wisfilter],[data-sluitfilter],[data-vink],[data-loc],[data-plek],[data-actie],[data-maand],[data-jaar],[data-naarmaand],[data-ga],[data-terug],[data-plant],[data-bewerk],[data-nieuw],[data-opslaan],[data-verversen],[data-wissen]');
  if (!el || el.closest('#dlg')) return;
  const d = el.dataset;
  if (d.modus != null) { if (d.modus) document.documentElement.dataset.thema = d.modus; else delete document.documentElement.dataset.thema; opslag.set('thema', d.modus); return teken(); }
  if (d.verplaats != null) return verplaats(d.verplaats);
  if (d.taak != null) return taakForm(TK[+d.taak]);
  if (d.nieuwtaak != null) return taakForm(null);
  if (d.nieuwplek != null) return rijForm('plek');
  if (d.nieuwplant != null) return rijForm('plant');
  if (d.bewerkplek != null) return rijForm('plek', d.bewerkplek);
  if (d.bewerkplant != null) return rijForm('plant', d.bewerkplant);
  if (d.fotoweg != null) { const [soort, loc, id, i] = d.fotoweg.split('|'); return fotoWeg(soort, loc, id, +i); }
  if (d.fotoplus != null) { const [soort, loc, id] = d.fotoplus.split('|'); return fotoPlus(soort, loc, id); }
  if (d.filters != null) { const fs = $('#filters'); fs.innerHTML = route[0] === 'planten' ? plantFilterSheet() : filterSheet(); return fs.showModal(); }
  if (d.psoort != null) { const ps = S.psoort || []; S.psoort = ps.includes(d.psoort) ? ps.filter(x => x !== d.psoort) : [...ps, d.psoort]; return teken(); }
  if (d.pwis != null) { S.psoort = []; return teken(); }
  if (d.sluitfilter != null) return $('#filters').close();
  if (d.wisfilter != null) { S.loc = ''; S.plek = ''; S.actie = ''; }
  if (d.vink != null) return vink(TK[+d.vink]);
  else if (d.loc != null) { S.loc = d.loc; S.plek = ''; }
  else if (d.plek != null) S.plek = d.plek;
  else if (d.actie != null) S.actie = d.actie;
  else if (d.maand != null) { if (+d.maand === 0) { S.jaar = NUJ; S.maand = NUM; } else { const x = ym(S.jaar, S.maand) + +d.maand; S.jaar = Math.floor(x / 12); S.maand = x % 12 + 1; } }
  else if (d.jaar != null) S.jaar += +d.jaar;
  else if (d.naarmaand != null) { S.maand = +d.naarmaand; S.tzoek = ''; if (route[0] === 'taken') { teken(); return scrollTo(0, 0); } return ga('taken'); }
  else if (d.ga != null) return ga(d.ga);
  else if (d.terug != null) return history.length > 1 ? history.back() : ga('taken');
  else if (d.plant != null) { const [l, p] = d.plant.split('|'); return ga('plant/' + l + '/' + p); }
  else if (d.bewerk != null) return bewerk(d.bewerk);
  else if (d.nieuw != null) return nieuw(d.nieuw);
  else if (d.opslaan != null) { opslag.set('api', $('#i-api').value.trim()); opslag.set('sleutel', $('#i-sleutel').value.trim()); return laad().then(() => { if (D) ga('taken'); }); }
  else if (d.verversen != null) return laad();
  else if (d.wissen != null) { if (confirm('Niet-verstuurde wijzigingen wissen?')) { wachtrij = []; opslag.set('wachtrij', []); laad(true); } return; }
  teken();
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'zoek') { S.zoek = ev.target.value; $('#plantlijst').innerHTML = plantenLijst(); }
  if (ev.target.id === 'tzoek') { S.tzoek = ev.target.value; TK = []; $('#app').innerHTML = takenInhoud(); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && D) laad(true); });
teken();
laad(true);
</script>
