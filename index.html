<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161b13" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<title>Tuin</title>
<style>
:root{--bg:#f5f2ea;--kaart:#fff;--tekst:#1f2a1c;--zacht:#5e6a57;--lijn:#e1dbcc;--rand:#d9d3c4;--vlak:#e8e3d6;--groen:#2f5a24;--groen2:#dcebd3;--opgroen:#fff;--rood:#8a3a1c;--rood2:#f6ddd0;--geel:#f3e6c4;--geeltekst:#6b5410;--schaduw:0 1px 0 rgba(31,42,28,.06);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#161b13;--kaart:#20271c;--tekst:#e6eadf;--zacht:#a3ad99;--lijn:#323a2c;--rand:#3e4836;--vlak:#2a3224;--groen:#9cc583;--groen2:#2e3d27;--opgroen:#10200b;--rood:#f0a58c;--rood2:#3d2620;--geel:#3a3320;--geeltekst:#e6cf8a;--schaduw:none}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tekst);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:var(--groen)}
button,input,select,textarea{font:inherit;color:inherit}
svg{flex:none}
h1,.groot{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;font-weight:700}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;flex-direction:column;gap:12px}
header .rij{display:flex;align-items:center;gap:6px}
header h1{font-size:26px;line-height:1.1;margin:0;flex:1}
header .midden{flex:1;text-align:center}header .midden h1{font-size:28px}
header .midden .sub{margin:0}
.knopje{min-height:44px;border:1px solid var(--rand);background:var(--kaart);border-radius:12px;padding:0 14px;cursor:pointer;font-weight:500}
.knopje.primair{background:var(--groen);color:var(--opgroen);border-color:var(--groen);font-weight:600}
.knopje.rand{background:none;border-color:var(--groen);color:var(--groen);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.rond{width:44px;height:44px;border-radius:22px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--tekst);flex:none}
.rond:hover{background:var(--vlak)}
.seg{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--vlak);border-radius:12px;padding:3px;min-height:44px}
.seg button{border:0;border-radius:9px;background:none;font-size:14px;color:var(--zacht);cursor:pointer;padding:0 6px}
.seg button.aan{background:var(--kaart);color:var(--tekst);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.filterknop{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--rand);background:var(--kaart);display:grid;place-items:center;cursor:pointer;flex:none}
.filterknop .stip{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:4px;background:var(--groen)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.rol{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chips.rol::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;border:1px solid var(--rand);background:var(--kaart);border-radius:20px;padding:0 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.aan{background:var(--groen);border-color:var(--groen);color:var(--opgroen);font-weight:600}
.chip.klein{min-height:32px;font-size:13px;padding:0 10px 0 12px;display:inline-flex;align-items:center;gap:4px}
.voortgang{display:flex;flex-direction:column;gap:6px}
.voortgang .tekst{display:flex;justify-content:space-between;font-size:13px;color:var(--zacht)}.voortgang b{color:var(--tekst);font-weight:600}
.balk{height:6px;border-radius:3px;background:var(--lijn);overflow:hidden}.balk div{height:100%;background:var(--groen);border-radius:3px}
main{padding:4px 16px 16px;max-width:1200px;margin:0 auto}
h2{display:flex;align-items:center;gap:8px;font-size:13px;margin:20px 4px 8px;color:var(--zacht);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
h2.laat{color:var(--rood)}
.tel{font-size:12px;font-weight:600;background:var(--vlak);color:var(--tekst);border-radius:10px;padding:1px 8px;letter-spacing:0}
h2.laat .tel{background:var(--rood2);color:var(--rood)}
h3{margin:0 0 6px;font-size:18px}
.lijst{display:grid;gap:8px}
.kaart{background:var(--kaart);border:0;border-radius:16px;padding:12px 14px;box-shadow:var(--schaduw)}
.groep{display:grid;background:var(--kaart);border-radius:16px;overflow:hidden;box-shadow:var(--schaduw)}
.groep>.kaart{border-radius:0;box-shadow:none;border-bottom:1px solid var(--lijn)}.groep>.kaart:last-child{border-bottom:0}
.taak{display:flex;gap:4px;align-items:flex-start;padding-left:6px}
.taak.klaar .tk{opacity:.55}.taak.klaar .titel{text-decoration:line-through}
.vink{flex:none;width:44px;height:44px;border:0;background:none;cursor:pointer;display:grid;place-items:center;margin:-8px 0 -8px;padding:0;color:var(--opgroen)}
.vink span{width:26px;height:26px;border-radius:13px;border:2px solid var(--groen);display:grid;place-items:center}
.taak.klaar .vink span{background:var(--groen)}
.laat .vink span{border-color:var(--rood)}.laat .taak:not(.klaar) .sub{color:var(--rood)}
.ico{flex:none;width:44px;text-align:center;font-size:18px}
.tk{flex:1;min-width:0}
.kop{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--zacht)}
.actie{border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
.titel{font-weight:600;font-size:16px;margin-top:2px}
.sub{font-size:13px;color:var(--zacht);margin-top:2px}
.suggestie{background:var(--geel)}
.waarschuwing{box-shadow:inset 0 0 0 1px var(--rood)}.waarschuwing .titel{color:var(--rood)}
details{margin-top:4px;font-size:13.5px}summary{cursor:pointer;color:var(--groen);font-size:13px;padding:4px 0}
.link{background:none;border:0;padding:0;color:var(--groen);cursor:pointer;text-decoration:underline;font-size:inherit}
.leeg{color:var(--zacht);padding:14px 4px}
.raster{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.plekkaart{cursor:pointer;min-height:72px}.plekkaart b{font-size:16px}.plekkaart .getal{font-size:13px;color:var(--zacht)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.stats .kaart{padding:10px 12px}.stats .groot{font-size:24px;line-height:1.2}.stats .sub{margin:0}
.foto{width:100%;border-radius:16px;display:block;max-height:340px;object-fit:cover;background:var(--lijn)}
.fotos{display:flex;gap:8px;overflow-x:auto;margin:4px 0 8px}.fotos figure{position:relative;margin:0;flex:none}.fotos img{height:180px;max-width:80vw;border-radius:12px;display:block;object-fit:cover;background:var(--lijn)}
.fotoweg{position:absolute;top:6px;right:6px;width:36px;height:36px;background:rgba(20,26,18,.6);color:#fff}.fotoweg:hover{background:rgba(20,26,18,.8)}
.fotoplus{flex:none;width:130px;height:180px;border-radius:12px;border:2px dashed var(--rand);background:none;color:var(--groen);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:13px;font-weight:600}
.mini-foto{flex:none;width:48px;height:48px;border-radius:12px;object-fit:cover;background:var(--vlak);display:grid;place-items:center;color:var(--groen);font-size:22px}
.plekkaart{display:flex;gap:12px;align-items:center}.plekkaart .mini-foto{width:56px;height:56px}
#d-voorbeeld{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:10px;display:none}
dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;font-size:14px}dt{color:var(--zacht)}dd{margin:0}
.plantrij{display:flex;gap:12px;align-items:center;cursor:pointer;min-height:56px}
.plantrij .naam{font-weight:600}.plantrij .lat{font-style:italic;color:var(--zacht);font-size:13px}
.dot{flex:none;width:10px;height:10px;border-radius:5px;background:var(--groen)}.dot.gepland{background:none;border:2px solid var(--geeltekst)}.dot.weg{background:var(--rand)}
.bewerk{display:inline-flex;align-items:center;gap:4px;color:var(--groen);font-size:13px;font-weight:600}
.status{font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--groen2);color:var(--groen)}
.status.gepland{background:var(--geel);color:var(--geeltekst)}.status.weg{background:var(--vlak);color:var(--zacht);text-decoration:line-through}
.sier{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin:6px 0;font-size:10px;text-align:center}
.sier div{border-radius:4px;padding:4px 0 2px;color:#1f2a1c}
.score{letter-spacing:2px;color:var(--groen)}
.jaar td,.jaar th{padding:9px 8px;border-bottom:1px solid var(--lijn);text-align:left;vertical-align:top}
.jaar{width:100%;border-collapse:collapse;background:var(--kaart);border-radius:16px;overflow:hidden}
.jaar tr{cursor:pointer}.jaar .nu{background:var(--groen2)}
.mini{display:inline-block;border-radius:5px;padding:0 5px;margin:1px;font-size:12px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--kaart);border-top:1px solid var(--lijn);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;font-size:11.5px;color:var(--zacht);text-decoration:none}
nav a span{display:grid;place-items:center;padding:3px 16px;border-radius:14px}
nav a.aan{color:var(--groen);font-weight:600}nav a.aan span{background:var(--groen2)}
label{display:block;margin:12px 0 4px;font-size:13px;color:var(--zacht);font-weight:500}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--rand);border-radius:12px;background:var(--kaart)}
dialog{border:0;border-radius:20px;padding:18px;width:min(440px,94vw);background:var(--bg);color:var(--tekst)}
dialog::backdrop{background:rgba(20,26,18,.45)}
dialog h3{font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:22px}
#filters{margin:auto 0 0;max-width:none;width:100%;max-height:90vh;border-radius:24px 24px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom));overflow:auto;display:none;flex-direction:column;gap:16px}
#filters[open]{display:flex}
#filters .greep{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--rand)}
#filters .stap{display:flex;flex-direction:column;gap:8px}#filters .stap>div:first-child{font-size:13px;font-weight:600;color:var(--zacht)}
.acties{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.acties button{min-height:48px;border-radius:12px;border:1px solid var(--rand);background:var(--kaart);display:flex;align-items:center;gap:10px;padding:0 12px;text-align:left;cursor:pointer;font-size:14px}
.acties button.aan{border:2px solid var(--groen);font-weight:600}.acties button.nul{opacity:.5}
.acties i{width:14px;height:14px;border-radius:4px;flex:none}.acties b{flex:1;font-weight:inherit}.acties small{color:var(--zacht);font-size:12.5px}
.knoppen{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:flex-end}
#melding{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:9;background:var(--tekst);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;display:none;max-width:92vw}
.zoek{margin:0}
@media (min-width:900px){
 body{padding:0 0 0 200px}
 nav{top:0;bottom:0;right:auto;width:200px;display:flex;flex-direction:column;gap:2px;border-top:0;border-right:1px solid var(--lijn);padding:16px 10px}
 nav a{flex-direction:row;justify-content:flex-start;gap:10px;min-height:44px;padding:0 6px;font-size:15px}nav a span{padding:4px 10px}
 .lijst{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
 header{padding:18px 28px 12px}main{padding:4px 28px 24px}
 header>*{max-width:1144px;width:100%;margin:0 auto}
 #filters{margin:auto;max-width:520px;border-radius:24px}
 #melding{bottom:24px}
}
</style>
</head>
<body>
<header id="kop"></header>
<main id="app"><p class="leeg">Laden…</p></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<dialog id="filters" aria-label="Filters"></dialog>
<div id="melding"></div>
<script>
'use strict';
// URL van de Apps Script-webapp (eindigt op /exec). Kan per toestel worden overschreven bij Instellingen.
const API_STANDAARD = 'https://script.google.com/macros/s/AKfycbzLQXrTTQ9wl5OYnszBA7yb-Rk7p4oqvDdXNDjtvbF5KoGaRSlRBQh3_4gIitba5hbZ/exec';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1gkO__1D6oWzxG2rEm-hj0PXKLjp2ZVHNyVd9Rf0jJIg/edit';
const MK = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const MN = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const SIER = {B:['#f2b8d2','bloei'],L:['#a9cf94','blad'],E:['#d77b6b','bes of vrucht'],Z:['#c9ad7c','zaadhoofden'],W:['#9fb0c4','wintersilhouet'],'-':['transparent','']};
const $ = s => document.querySelector(s);
const svg = (d, w = 22, sw = 2) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC = { l: '<path d="M15 18l-6-6 6-6"/>', r: '<path d="M9 18l6-6-6-6"/>', filter: '<path d="M4 6h16M7 12h10M10 18h4"/>', vink: '<path d="M5 12l5 5L20 7"/>', pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>', x: '<path d="M18 6L6 18M6 6l12 12"/>', plus: '<path d="M12 5v14M5 12h14"/>',
  taken: '<path d="M4 12l5 5L20 6"/>', plekken: '<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>', planten: '<path d="M12 21V11"/><path d="M12 11C12 6 8 4 4 4c0 5 3 7 8 7z"/><path d="M12 14c0-4 3-6 8-6 0 4-3 6-8 6z"/>', jaar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', meer: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>' };
Object.assign(IC, { bak: '<rect x="3" y="11" width="18" height="8" rx="1.5"/><path d="M7 11V8M12 11V5M17 11V8"/>', zone: IC.planten, kas: '<path d="M3 21V11l9-7 9 7v10z"/><path d="M12 4v17M3 15h18"/>', boom: '<circle cx="12" cy="9" r="6"/><path d="M12 15v6M9 21h6"/>', fruit: '<circle cx="8" cy="15" r="3"/><circle cx="16" cy="15" r="3"/><circle cx="12" cy="9" r="3"/><path d="M12 6c0-2 1-3 3-3"/>', compost: '<path d="M4 8h16l-1.5 12h-13z"/><path d="M9 4h6M8 13h8"/>', algemeen: '<path d="M12 3v10"/><path d="M8 13h8l-1 5a3 3 0 01-6 0z"/>', foto: '<rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 17l-5-5-9 8"/>' });
const plekSoort = p => IC[p.icoon] && p.icoon || (/^bak/.test(p.id) ? 'bak' : { kas: 'kas', boomgaard: 'boom', fruit: 'fruit', compost: 'compost', algemeen: 'algemeen' }[p.id] || 'zone');
// Eigen foto's (tabblad Fotos) gaan voor op de foto's uit het plan, ook als de lijst leeg is.
const fotoKey = (soort, loc, id) => soort + '|' + loc + '|' + id;
const fotosVan = (soort, loc, id, plan) => { const f = D.foto[fotoKey(soort, loc, id)]; return f ? String(f.urls || '').split(/\s+/).filter(Boolean) : lijst(plan); };
const fotosPlant = p => fotosVan('plant', p.locatie, p.id, p.fotos), fotosPlek = p => fotosVan('plek', p.locatie, p.id, p.foto);
function beeld(u, w) {
  const m = /drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/.exec(u) || /lh3\.googleusercontent\.com\/d\/([\w-]+)/.exec(u);
  return m ? 'https://lh3.googleusercontent.com/d/' + m[1] + '=w' + w : u;
}
const mini = (urls, ico) => urls.length ? `<img class="mini-foto" src="${esc(beeld(urls[0], 160))}" alt="" loading="lazy">` : `<span class="mini-foto leeg-foto">${ico}</span>`;
function fotoStrook(soort, loc, id, urls) {
  const k = esc(fotoKey(soort, loc, id));
  return `<div class="fotos">${urls.map((u, i) => `<figure><img src="${esc(beeld(u, 1200))}" alt="" loading="lazy"><button class="rond fotoweg" data-fotoweg="${k}|${i}" aria-label="Foto verwijderen">${svg(IC.x, 18, 2.5)}</button></figure>`).join('')}<button class="fotoplus" data-fotoplus="${k}">${svg(IC.foto, 24, 1.8)}<span>Foto toevoegen</span></button></div>`;
}
const terug = () => `<button class="rond" data-terug aria-label="Terug">${svg(IC.l)}</button>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lijst = s => String(s || '').split(/\s*,\s*/).filter(Boolean);
const opslag = {
  get(k, d) { try { const v = localStorage.getItem('tuin.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('tuin.' + k, JSON.stringify(v)); } catch (e) {} }
};
const vandaag = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const NU = new Date(), NUJ = NU.getFullYear(), NUM = NU.getMonth() + 1;
const ym = (j, m) => j * 12 + m - 1;
const ymTekst = s => { const m = /^(\d{4})-(\d{1,2})/.exec(s || ''); return m ? ym(+m[1], +m[2]) : null; };

let D = null, laadtijd = '', bezig = false, memo = new Map();
let wachtrij = opslag.get('wachtrij', []);
const S = Object.assign({ jaar: NUJ, maand: NUM, loc: '', plek: '', actie: '', zoek: '', ploc: '' }, opslag.get('filters', {}));
if (opslag.get('filterdag', '') !== vandaag()) { S.jaar = NUJ; S.maand = NUM; }
let route = ['taken'];

/* ---------- gegevens ---------- */
function rijen(t) {
  if (!t || !t.length) return [];
  const kop = t[0].map(k => String(k).trim());
  return t.slice(1).map(r => { const o = {}; kop.forEach((k, i) => { if (k) o[k] = String(r[i] ?? '').trim(); }); return o; });
}
function maanden(s) {
  return lijst(s).map(x => {
    const [a, b] = x.split('-').map(y => MK.indexOf(y.trim().slice(0, 3).toLowerCase()) + 1);
    if (!a) return null;
    const e = b || a, ms = [];
    for (let m = a, i = 0; i < 12; i++) { ms.push(m); if (m === e) break; m = m % 12 + 1; }
    return { start: a, eind: e, maanden: ms };
  }).filter(Boolean);
}
function bouw(j) {
  const t = j.tabs || {};
  D = {};
  for (const n of ['Locaties','Acties','Plekken','Planten','Beplanting','Regels','Projecttaken','Info','Stand','Voortgang','Instellingen','Fotos']) D[n] = rijen(t[n]);
  D.inst = {}; D.Instellingen.forEach(r => D.inst[r.sleutel] = r.waarde);
  D.actie = {}; D.Acties.forEach(a => D.actie[a.id] = a);
  D.Plekken = D.Plekken.filter(p => p.status !== 'vervallen');
  D.plek = {}; D.Plekken.forEach(p => D.plek[p.locatie + '|' + p.id] = p);

  else if (d.plek != null) S.plek = d.plek;
  else if (d.actie != null) S.actie = d.actie;
  else if (d.maand != null) { if (+d.maand === 0) { S.jaar = NUJ; S.maand = NUM; } else { const x = ym(S.jaar, S.maand) + +d.maand; S.jaar = Math.floor(x / 12); S.maand = x % 12 + 1; } }
  else if (d.jaar != null) S.jaar += +d.jaar;
  else if (d.naarmaand != null) { S.maand = +d.naarmaand; return ga('taken'); }
  else if (d.ga != null) return ga(d.ga);
  else if (d.terug != null) return history.length > 1 ? history.back() : ga('taken');
  else if (d.plant != null) { const [l, p] = d.plant.split('|'); return ga('plant/' + l + '/' + p); }
  else if (d.bewerk != null) return bewerk(d.bewerk);
  else if (d.nieuw != null) return nieuw(d.nieuw);
  else if (d.opslaan != null) { opslag.set('api', $('#i-api').value.trim()); opslag.set('sleutel', $('#i-sleutel').value.trim()); return laad().then(() => { if (D) ga('taken'); }); }
  else if (d.verversen != null) return laad();
  else if (d.wissen != null) { if (confirm('Niet-verstuurde wijzigingen wissen?')) { wachtrij = []; opslag.set('wachtrij', []); laad(true); } return; }
  teken();
});
document.addEventListener('input', ev => { if (ev.target.id === 'zoek') { S.zoek = ev.target.value; $('#plantlijst').innerHTML = plantenLijst(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && D) laad(true); });
teken();
laad(true);
